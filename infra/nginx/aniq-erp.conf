# Aniq ERP — Production Nginx config
#
# Usage:
#   1) Place this file at /etc/nginx/sites-available/aniq-erp.conf
#   2) Replace <YOUR_DOMAIN> with your domain
#   3) Run: certbot --nginx -d <YOUR_DOMAIN>
#   4) sudo ln -s /etc/nginx/sites-available/aniq-erp.conf /etc/nginx/sites-enabled/
#   5) sudo nginx -t && sudo systemctl reload nginx

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name <YOUR_DOMAIN> www.<YOUR_DOMAIN>;
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name <YOUR_DOMAIN> www.<YOUR_DOMAIN>;

    # Filled by certbot
    ssl_certificate     /etc/letsencrypt/live/<YOUR_DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<YOUR_DOMAIN>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP — allow Next.js inline scripts, Google Fonts, our own API
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.telegram.org; frame-ancestors 'self';" always;

    # Limits
    client_max_body_size 25M;
    client_body_timeout 30s;
    send_timeout 30s;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/xml+rss application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;

    # ---- API (FastAPI) ----
    location /api/ {
        # Rate limit: 30 req/s with 60 burst per IP
        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # ---- API docs (separate looser limit) ----
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- Health check (allow without rate limit) ----
    location = /health {
        proxy_pass http://127.0.0.1:8001/health;
        access_log off;
    }

    # ---- Web (Next.js) ----
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # ---- Next.js static assets (immutable, cache aggressively) ----
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---- Static icons + favicon ----
    location ~ \.(ico|svg|png|jpg|jpeg|gif|webp|woff2)$ {
        proxy_pass http://127.0.0.1:3010;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}

# Rate-limit zone — put in nginx.conf http{} block
# limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
