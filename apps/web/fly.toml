# Build context for this app = apps/web (this file's own directory) —
# matches docker-compose.yml's `context: ./apps/web`.
app = "aniq-erp-web-uz"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

  [build.args]
    NEXT_PUBLIC_API_URL = "https://aniq-erp-api-uz.fly.dev/api/v1"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
