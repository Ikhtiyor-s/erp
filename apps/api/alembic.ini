# Aniq ERP — Alembic configuration
#
# Migration usage:
#   docker exec erp-api alembic revision -m "add foo column"
#   docker exec erp-api alembic upgrade head
#   docker exec erp-api alembic downgrade -1
#   docker exec erp-api alembic history
#
# Note: DATABASE_URL is overridden in env.py from app settings.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = postgresql+asyncpg://erp:erp@postgres:5432/erp

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
