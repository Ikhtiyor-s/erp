name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: erp
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          pip install -r apps/api/requirements.txt
      - name: Init schema
        env:
          PGPASSWORD: erp
        run: |
          psql -h localhost -U erp -d erp -f infra/postgres/init.sql
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://erp:erp@localhost:5432/erp
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-secret
          ENV: test
        run: |
          cd apps/api && pytest tests/ -v --tb=short

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install deps
        run: cd apps/web && npm ci
      - name: Type check
        run: cd apps/web && npx tsc --noEmit
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8001/api/v1
        run: cd apps/web && npm run build
